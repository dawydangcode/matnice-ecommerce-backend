services:
  app:
    image: node:20-bullseye
    restart: always
    ports:
      - 3000:3000
    command: /bin/bash -c "
      apt-get update &&
      apt-get install -y python3 python3-pip python3-venv build-essential libopencv-dev &&
      python3 -m venv /var/www/.venv &&
      source /var/www/.venv/bin/activate &&
      pip install --upgrade pip &&
      pip install -r /var/www/ai-models/faceshape-ai-package/requirements.txt &&
      cd /var/www && npm run start:dev
      "
    volumes:
      - ./:/var/www
    depends_on:
      - mysql
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    networks:
      - app-network

  mysql:
    image: mysql:8.0.42
    restart: always
    command: mysqld --default-authentication-plugin=mysql_native_password
    ports:
      - 3333:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - /etc/ssl/certs/nginx-selfsigned.crt:/etc/ssl/certs/nginx-selfsigned.crt:ro
      - /etc/ssl/private/nginx-selfsigned.key:/etc/ssl/private/nginx-selfsigned.key:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - app-network

volumes:
  mysql_data:
  nginx_logs:

networks:
  app-network:
    driver: bridge
